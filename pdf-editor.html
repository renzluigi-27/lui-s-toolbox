<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Editor</title>
  <link rel="stylesheet" href="/assets/css/global.css" />
  <link rel="stylesheet" href="/assets/css/aio-tool.css" />
  <link rel="stylesheet" href="/assets/css/liquid.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
</head>
<body>
<div class="bg-orbs">
  <div class="bg-orb bg-orb-1"></div>
  <div class="bg-orb bg-orb-2"></div>
  <div class="bg-orb bg-orb-3"></div>
</div>
  <div class="page-container">
    <div class="content">

      <header>
        <h1>PDF Editor</h1>
        <p>Merge, split, edit, and convert PDFs &mdash; free, runs entirely in your browser</p>
      </header>

      <div class="container">
        <a class="back-link" href="index.html">&#8592; Back to Tools</a>

        <div class="mode-tabs" id="modeTabs">
          <button class="mode-tab active" data-mode="merge">Merge / Split</button>
          <button class="mode-tab" data-mode="watermark">Watermark / Pages</button>
          <button class="mode-tab" data-mode="images">Image &harr; PDF</button>
          <button class="mode-tab" data-mode="emlToPdf">EML to PDF</button>
          <button class="mode-tab" data-mode="editText">Edit text</button>
          <button class="mode-tab" data-mode="ocr">OCR</button>
          <button class="mode-tab" data-mode="docs">Document &harr; PDF</button>
          <button class="mode-tab" data-mode="compress">Compress</button>
        </div>

        <div id="mergeMount"></div>
        <div id="watermarkMount" style="display:none;"></div>
        <div id="imagesMount" style="display:none;"></div>
        <div id="emlToPdfMount" style="display:none;"></div>
        <div id="editTextMount" style="display:none;"></div>
        <div id="ocrMount" style="display:none;"></div>
        <div id="docsMount" style="display:none;"></div>
        <div id="compressMount" style="display:none;"></div>

      </div><!-- /.container -->
      <div id="footer"></div>
    </div><!-- /.content -->
  </div><!-- /.page-container -->

  <script src="/assets/js/pdf-editor.js"></script>
  <script src="/assets/js/pdf-editor-tools.js"></script>
  <script src="/assets/js/eml-to-pdf.js"></script>
  <script src="/assets/js/pdf-editor-phase2.js"></script>
  <script src="/assets/js/pdf-editor-phase3.js"></script>
  <script src="/assets/js/security.js"></script>

</body>
</html>
